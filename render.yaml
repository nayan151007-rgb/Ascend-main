services:
  - type: web
    name: ascend-research
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      - key: DB_PATH
        value: /tmp/ascend.db
      - key: RATE_LIMIT_PER_MIN
        value: "8"
